<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --sep:rgba(60,60,67,.16); --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --fill:rgba(118,118,128,.12);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --gray:#8E8E93; --indigo:#5856D6; --teal:#30B0C7; --pink:#FF2D55; --purple:#AF52DE;
  /* Une couleur par catégorie, la même partout */
  --c-ren:#FF8A00; --c-ren2:#FFB547; --c-ctrl:#F2B705; --c-ctrl2:#FFDE59; --on-ctrl:#3B2C00; --c-ann:#2DB84F; --c-ann2:#6EDC8C; --c-rdv:#FF2D55; --c-rdv2:#FF7A93; --c-call:#007AFF; --c-call2:#4DA3FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);font:17px/1.35 var(--font);color:var(--label);-webkit-font-smoothing:antialiased;letter-spacing:-.012em;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid rgba(0,122,255,.45);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--label2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- Écran ---- */
#screen{max-width:760px;margin:0 auto;padding:0 20px 130px;min-height:100vh}
.hero{padding:34px 4px 6px;position:relative}
body[data-tab="today"]{background:linear-gradient(180deg,#FFEFD9 0,#FFF7DC 150px,#F2F2F7 320px) no-repeat,#F2F2F7}
html,body{overflow-x:hidden}
.date{font-size:15px;font-weight:600;color:var(--label2);margin:0}
.large-title{font-family:var(--font-d);font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.003em;margin:2px 0 0}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.text-btn{background:none;border:0;color:var(--blue);font-size:17px;padding:6px 2px;cursor:pointer}
.text-btn:disabled{color:var(--label3)}
.sec-title{font-family:var(--font-d);font-size:22px;font-weight:700;margin:30px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title small{font-size:15px;font-weight:400;color:var(--label2);font-family:var(--font)}
.foot-note{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.4}

/* ---- Widgets colorés ---- */
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.widget{position:relative;border:0;border-radius:22px;padding:16px 16px 14px;color:#fff;text-align:left;cursor:pointer;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 8px 22px -12px rgba(0,0,0,.35)}
.widget::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.widget .w-top{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.widget .w-num{font-family:var(--font-d);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em}
.widget .w-sub{display:block;font-size:13.5px;opacity:.9;margin-top:4px;line-height:1.25}
.widget .w-num{display:block}
.widget:active{transform:scale(.98)}
.w-call{background:linear-gradient(145deg,var(--c-call2),var(--c-call))}
.w-rdv{background:linear-gradient(145deg,var(--c-rdv2),var(--c-rdv))}
.w-ren{background:linear-gradient(145deg,var(--c-ren2),var(--c-ren))}
.w-ctrl{background:linear-gradient(145deg,var(--c-ctrl2),var(--c-ctrl));color:var(--on-ctrl)}
.w-ctrl::after{background:rgba(255,255,255,.22)}
.w-ann{background:linear-gradient(145deg,var(--c-ann2),var(--c-ann))}

/* ---- Listes groupées ---- */
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.group+.group{margin-top:14px}
.row{display:flex;align-items:center;gap:13px;padding:10px 16px;min-height:54px;position:relative;background:none;border:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.row:not(:first-child)::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;height:.5px;background:var(--sep)}
.row.with-av{--inset:69px}
.row.with-ico{--inset:58px}
button.row:active,a.row:active{background:#E5E5EA}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title b{font-weight:650}
.row-sub{font-size:14.5px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub.wrap{white-space:normal}
.row-val{color:var(--label2);font-size:17px;white-space:nowrap}
.chev{width:15px;height:15px;color:#C4C4C7;stroke-width:2.6;margin-left:-4px}
.row.center{justify-content:center;color:var(--blue);font-weight:500}
.row.red{color:var(--red)}
.row.blue{color:var(--blue)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15.5px;flex:none;background:linear-gradient(160deg,#B4B4BA,#8E8E93);letter-spacing:.02em}
.av-ren{background:linear-gradient(160deg,var(--c-ren2),var(--c-ren))}
.av-ctrl{background:linear-gradient(160deg,var(--c-ctrl2),var(--c-ctrl));color:var(--on-ctrl)}
.av-ann{background:linear-gradient(160deg,var(--c-ann2),var(--c-ann))}
.av-rdv{background:linear-gradient(160deg,var(--c-rdv2),var(--c-rdv))}
.av-call{background:linear-gradient(160deg,var(--c-call2),var(--c-call))}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.sq .ic{width:19px;height:19px;stroke-width:2.1}
.sq.blue{background:var(--blue)} .sq.green{background:var(--green)} .sq.orange{background:var(--orange)} .sq.red{background:var(--red)} .sq.gray{background:var(--gray)}
.sq.ren{background:var(--c-ren)} .sq.ctrl{background:var(--c-ctrl);color:var(--on-ctrl)} .sq.ann{background:var(--c-ann)} .sq.rdv{background:var(--c-rdv)} .sq.call{background:var(--c-call)} .sq.purple{background:var(--purple)}
.dot-new{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:rgba(142,142,147,.16);color:#636366}
.pill.blue{background:rgba(0,122,255,.12);color:#0062CC} .pill.green{background:rgba(52,199,89,.16);color:#1E8A3D}
.pill.orange{background:rgba(255,149,0,.16);color:#B86A00} .pill.red{background:rgba(255,59,48,.13);color:#D70015}
.pill.ren{background:rgba(255,138,0,.15);color:#B05E00} .pill.ctrl{background:rgba(242,183,5,.22);color:#755800} .pill.ann{background:rgba(45,184,79,.15);color:#1C7A36} .pill.rdv{background:rgba(255,45,85,.12);color:#D3002E}
.empty{background:var(--cell);border-radius:14px;padding:30px 20px;text-align:center;color:var(--label2)}
.empty .big-ic{width:46px;height:46px;border-radius:50%;background:rgba(52,199,89,.15);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}

/* ---- Contrôles iOS ---- */
.segmented{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:14px 0 6px}
.segmented button{flex:1;border:0;background:none;padding:7px 6px;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--label)}
.segmented button[aria-pressed="true"]{background:#fff;font-weight:650;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.search{position:relative;margin-top:14px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--label2)}
.search input{width:100%;border:0;background:var(--fill);border-radius:11px;padding:9px 12px 9px 36px;font-size:17px;outline:none}
.search input:focus{background:rgba(118,118,128,.18)}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.16);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.switch:disabled{opacity:.5}
.stepper{display:flex;align-items:center;gap:0;background:var(--fill);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:none;width:44px;height:32px;font-size:20px;cursor:pointer;color:var(--label)}
.stepper button:active{background:rgba(0,0,0,.08)}
.stepper span{min-width:70px;text-align:center;font-size:15px;font-weight:600;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);line-height:32px}
.inline-input{border:0;background:none;text-align:right;font-size:17px;color:var(--label2);min-width:0;flex:1;outline:none;padding:4px 0}
.inline-input:focus{color:var(--label)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.tinted{background:rgba(0,122,255,.12);color:var(--blue)}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){filter:brightness(.92)}
.btn+.btn{margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:0;background:rgba(0,122,255,.1);color:var(--blue);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--blue);color:#fff}

/* ---- Barre d'onglets ---- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(249,249,249,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.18);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
#tabbar .tabs{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:11px;font-weight:500;padding:2px 0;position:relative}
#tabbar a .ic{width:27px;height:27px}
#tabbar a[aria-current="page"]{color:var(--blue)}
#tabbar a[aria-current="page"] .ic{stroke-width:2.2}
#tabbar .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:12px;font-weight:600;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid rgba(249,249,249,1)}

/* ---- Volets (sheets) ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;animation:fade .25s ease}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(700px,100%);height:94vh;background:var(--bg);border-radius:14px 14px 0 0;z-index:51;display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.no-anim{animation:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 8px;position:relative;flex:none}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3)}
.sheet-head h2{font-size:17px;font-weight:650;margin:6px 0 0;text-align:center}
.sheet-head .left{justify-self:start;margin-top:6px}
.sheet-head .right{justify-self:end;margin-top:6px;font-weight:600}
.sheet-body{overflow-y:auto;padding:6px 20px 40px;flex:1}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.contact-head{text-align:center;padding:4px 0 14px}
.contact-head .avatar{width:84px;height:84px;font-size:32px;margin:0 auto 10px}
.contact-head h1{font-family:var(--font-d);font-size:26px;font-weight:700;margin:0;line-height:1.15}
.contact-head p{margin:4px 0 0;color:var(--label2);font-size:15px}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:4px 0 6px}
.action{background:var(--cell);border:0;border-radius:13px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--blue);font-size:12px;font-weight:500;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action .ic{width:24px;height:24px}
.action.off{color:var(--label3);pointer-events:none}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.res{background:var(--cell);border:0;border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;color:var(--label);text-align:center;line-height:1.2}
.res .bub{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.res .bub .ic{width:24px;height:24px;stroke-width:2.2}
.res[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--blue)}
.res:active{transform:scale(.97)}
.b-green{background:linear-gradient(160deg,#5EDB7C,var(--green))} .b-gray{background:linear-gradient(160deg,#AEAEB2,var(--gray))}
.b-blue{background:linear-gradient(160deg,var(--c-call2),var(--c-call))} .b-orange{background:linear-gradient(160deg,#FFB547,#FF9500)}
.b-red{background:linear-gradient(160deg,#FF6961,var(--red))} .b-dark{background:linear-gradient(160deg,#8E8E93,#48484A)}
.panel-in{background:var(--cell);border-radius:14px;padding:14px 16px;margin-top:12px}
.panel-in label{display:block;font-size:13px;color:var(--label2);margin-bottom:4px}
.panel-in input[type=date],.panel-in input[type=time],.panel-in select,.panel-in textarea,.field-input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:17px;outline:none}
.panel-in textarea{min-height:110px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.life{margin-top:8px}
.life-bar{height:8px;border-radius:4px;background:#E5E5EA;overflow:hidden}
.life-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c-ren2),var(--c-ren))}
.life-fill.done{background:linear-gradient(90deg,#5EDB7C,var(--green))}
.life-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--label2);margin-top:5px}
.note-input{width:100%;border:0;background:var(--cell);border-radius:12px;padding:12px 14px;font-size:16px;margin-top:10px;outline:none}

/* ---- Bulle de message ---- */
.bubble-wrap{display:flex;justify-content:flex-end;padding:14px 12px;background:var(--cell);border-radius:14px}
.bubble{background:linear-gradient(180deg,#2B8CFF,#007AFF);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:16px;line-height:1.38;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.mail-card{background:var(--cell);border-radius:14px;padding:14px 16px;font-size:15.5px;white-space:pre-wrap;line-height:1.45}
.mail-card b{display:block;font-size:16px;margin-bottom:8px;padding-bottom:8px;border-bottom:.5px solid var(--sep)}
.script-card{background:var(--cell);border-radius:14px;padding:14px 16px;font-size:15.5px;white-space:pre-wrap;line-height:1.55}
.legal{font-size:13px;color:#8A5300;background:rgba(255,149,0,.12);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.4}
.count-big{text-align:center;margin:16px 0 4px}
.count-big b{font-family:var(--font-d);font-size:48px;font-weight:700;display:block;line-height:1}
.count-big span{color:var(--label2);font-size:15px}

/* ---- Agenda ---- */
.days{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;background:var(--cell);border-radius:16px;padding:10px 8px;margin-top:14px}
.day{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border-radius:12px}
.day .wd{font-size:12px;color:var(--label2);font-weight:600}
.day .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:500}
.day.today .num{color:var(--c-rdv);font-weight:700}
.day.sel .num{background:var(--c-rdv);color:#fff;font-weight:700}
.day .cnt{font-size:11.5px;color:var(--label2);height:14px}
.appt-time{width:56px;flex:none;font-weight:650;font-size:16px}
.appt-time small{display:block;font-weight:400;color:var(--label2);font-size:12.5px}
.appt-bar{width:4px;align-self:stretch;border-radius:2px;flex:none;margin:2px 0}
.summary-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.summary-chips span{background:var(--cell);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.summary-chips i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---- Barres de résultats ---- */
.stat-row{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.stat-row+.stat-row{border-top:.5px solid var(--sep)}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}
.stat-top b{font-size:19px;font-family:var(--font-d)}
.stat-top small{color:var(--label2);font-size:14px;margin-left:6px}
.stat-bar{height:7px;border-radius:4px;background:#EEEEF2;overflow:hidden}
.stat-bar i{display:block;height:100%;border-radius:4px}

/* ---- Import ---- */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--cell);border:2px dashed rgba(0,122,255,.35);border-radius:18px;padding:34px 16px;text-align:center;cursor:pointer;color:var(--blue);margin-top:14px;position:relative}
.drop.over,.drop:hover{background:#F0F7FF;border-color:var(--blue)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .ic{width:40px;height:40px;stroke-width:1.6}
.drop b{font-size:17px}
.drop span{color:var(--label2);font-size:14px}
.steps-n{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-n li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 16px}
.steps-n li+li{border-top:.5px solid var(--sep)}
.steps-n li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}

/* ---- Alertes, menus, message ---- */
.alert-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70;display:grid;place-items:center;animation:fade .2s}
.alert{width:280px;background:rgba(242,242,247,.97);border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.alert-body{padding:20px 16px 16px}
.alert-body h3{margin:0 0 4px;font-size:17px;font-weight:650}
.alert-body p{margin:0;font-size:13.5px;line-height:1.4}
.alert-btns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert-btns button{border:0;background:none;padding:12px;font-size:17px;color:var(--blue);cursor:pointer}
.alert-btns button+button{border-left:.5px solid var(--sep)}
.alert-btns .bold{font-weight:650}
.alert-btns .destructive{color:var(--red);font-weight:600}
.as-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(420px,calc(100% - 20px));z-index:71;animation:asup .28s cubic-bezier(.2,.85,.25,1)}
@keyframes asup{from{transform:translate(-50%,110%)}to{transform:translate(-50%,0)}}
.as{background:rgba(250,250,252,.97);border-radius:14px;overflow:hidden}
.as .as-title{padding:13px 16px;font-size:13px;color:var(--label2);text-align:center;border-bottom:.5px solid var(--sep)}
.as button{display:block;width:100%;border:0;background:none;padding:16px;font-size:19px;color:var(--blue);cursor:pointer}
.as button+button{border-top:.5px solid var(--sep)}
.as button.destructive{color:var(--red)}
.as-cancel{margin-top:8px;background:#fff;border-radius:14px}
.as-cancel button{font-weight:650;border:0;background:none;width:100%;padding:16px;font-size:19px;color:var(--blue);cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:rgba(30,30,32,.92);backdrop-filter:blur(10px);color:#fff;border-radius:16px;padding:11px 12px 11px 18px;font-size:15px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:rgba(255,255,255,.16);border:0;color:#fff;font-weight:650;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px}
#print-root{display:none}
@media (prefers-reduced-motion:reduce){.sheet,.as-wrap,.sheet-backdrop,.alert-backdrop{animation:none}#toast,.switch,.switch::after{transition:none}}
@media (max-width:520px){#screen{padding:0 16px 120px}.widgets{gap:12px}.widget{min-height:120px}.widget .w-num{font-size:38px}.results{gap:8px}.sheet-body{padding:6px 16px 40px}}
@media print{body>*:not(#print-root){display:none!important}#print-root{display:block;font:12px/1.4 Arial,sans-serif}#print-root table{border-collapse:collapse;width:100%}#print-root th,#print-root td{border:1px solid #999;padding:6px;vertical-align:top}}

/* ---- Après l'appel ---- */
.q-label{font-size:15px;font-weight:650;color:var(--label);margin:18px 4px 8px}
.q-label small{font-weight:400;color:var(--label2)}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:0;border-radius:16px;padding:15px 10px;font-size:17px;font-weight:650;background:var(--cell);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--label)}
.ans .ic{width:22px;height:22px;stroke-width:2.4}
.ans.yes .ic{color:var(--green)} .ans.no .ic{color:var(--red)}
.ans.yes[aria-pressed="true"]{background:var(--green);color:#fff} .ans.no[aria-pressed="true"]{background:#636366;color:#fff}
.ans[aria-pressed="true"] .ic{color:#fff}
.results.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.note-area{width:100%;min-height:96px;border:0;border-radius:14px;background:var(--cell);padding:12px 14px;font-size:16px;line-height:1.45;resize:vertical;outline:none;box-shadow:inset 0 0 0 1.5px transparent}
.note-area:focus{box-shadow:inset 0 0 0 2px rgba(0,122,255,.45)}
.note-area.need{box-shadow:inset 0 0 0 1.5px rgba(255,149,0,.55)}
.missing{font-size:13.5px;color:var(--label2);text-align:center;margin:8px 0 0}
.missing.ok{color:var(--green);font-weight:600}
.hint{font-size:14px;color:var(--label2);margin:10px 4px 0;line-height:1.4}
.mail-warn{font-size:13px;color:#8A5300;background:rgba(255,149,0,.12);border-radius:12px;padding:10px 12px;margin-top:10px}
.mail-body{min-height:300px!important}

/* Téléphone, SMS, réglages e-mail */
.tel-big{color:var(--label);font-size:20px;font-weight:650;margin-top:6px;letter-spacing:.01em}
.onoff-hint{font-size:13px;color:var(--label2);margin-top:2px}
.sms-body{min-height:130px}
.steps-box{background:#EAF3FF;border-radius:14px;padding:12px 16px;margin-top:12px;font-size:15px;line-height:1.45}
.steps-box ol{margin:6px 0 0 20px;padding:0}
.row.col{flex-direction:column;align-items:stretch;gap:0;padding-top:12px}
.row.col .segmented{margin:8px 0 4px}
.lbl-sm{display:none}
@media (max-width:420px){.lbl-lg{display:none}.lbl-sm{display:inline}.action{font-size:11.5px}.segmented button{font-size:13px;padding:7px 3px}}

</style>

<body>
<main id="screen" tabindex="-1"></main>

<noscript><p style="padding:24px;font-family:sans-serif">CRM AMZ a besoin de JavaScript : ouvre-le dans Edge, Chrome ou Safari.</p></noscript>
<script>
'use strict';
/* =====================================================================
   CRM AMZ — outil local de suivi des patients appareillés
   Toutes les données restent dans ce navigateur, sur cet ordinateur.
   ===================================================================== */

/* ---------- Utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = () => iso(new Date());
const nowStamp = () => { const d = new Date(); return `${iso(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n) {
  const d = parseISO(s); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return iso(d);
}
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
function monthsBetween(a, b) {
  const A = parseISO(a), B = parseISO(b);
  let m = (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth());
  if (B.getDate() < A.getDate()) m--; return m;
}
const fmtDate = s => s ? parseISO(s).toLocaleDateString('fr-FR') : '–';
const fmtDay = s => parseISO(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDayShort = s => parseISO(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
const fmtMonth = s => parseISO(s).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const fmtStamp = s => s ? `${fmtDate(s.slice(0, 10))}${s.length > 10 ? ' à ' + s.slice(11, 16).replace(':', 'h') : ''}` : '–';
const fmtHeure = h => h ? h.replace(':', 'h') : '';
const nf = n => Number(n).toLocaleString('fr-FR');
const pct = (a, b) => b ? Math.round(100 * a / b) + ' %' : '–';
const plural = (n, s, p) => `${nf(n)} ${n > 1 ? (p || (/[sx]$/.test(s) ? s : s + 's')) : s}`;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function ago(s) {
  if (!s) return '';
  const t = TODAY(); const d = daysBetween(s, t);
  if (d < 0) { const f = -d; if (f < 31) return `dans ${plural(f, 'jour')}`; return `dans ${monthsBetween(t, s)} mois`; }
  if (d === 0) return "aujourd'hui";
  if (d === 1) return 'hier';
  if (d < 31) return `il y a ${d} jours`;
  const m = monthsBetween(s, t);
  if (m < 12) return `il y a ${m} mois`;
  const y = Math.floor(m / 12), r = m % 12;
  return `il y a ${plural(y, 'an')}${r ? ` et ${r} mois` : ''}`;
}
function age(n) { if (!n) return null; return Math.floor(monthsBetween(n, TODAY()) / 12); }
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const nameKey = (nom, prenom) => norm(nom).replace(/ /g, '') + '|' + norm(prenom).replace(/ /g, '');
function titleCase(s) {
  return String(s || '').toLowerCase().replace(/(^|[\s\-'’])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
}
function fmtPhone(raw) {
  if (raw == null) return '';
  let d = String(raw).replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('+33')) d = '0' + d.slice(3);
  else if (d.startsWith('0033')) d = '0' + d.slice(4);
  else if (/^33\d{9}$/.test(d)) d = '0' + d.slice(2);
  else if (/^[1-9]\d{8}$/.test(d)) d = '0' + d; // zéro initial perdu par Excel

}
const digits = t => String(t || '').replace(/\D/g, '');
const isMobile = t => /^0[67]\d{8}$/.test(digits(t));
function intlPhone(t) { const d = digits(t); if (/^0\d{9}$/.test(d)) return '+33' + d.slice(1); return d ? '+' + d : ''; }
const telHref = t => 'tel:' + digits(t);
const civLong = c => c === 'Mme' ? 'Madame' : c === 'M.' ? 'Monsieur' : '';
const displayName = p => `${String(p.nom || '').toUpperCase()} ${p.prenom || ''}`.trim();
const fullTitle = p => `${p.civilite ? p.civilite + ' ' : ''}${displayName(p)}`;

/* ---------- Constantes métier ---------- */
const CANAUX = { tel: 'Appel', sms: 'SMS', email: 'Email', agent: 'Agent vocal', courrier: 'Courrier', centre: 'Au centre' };
const MOTIFS = { controle: 'Contrôle', renouvellement: 'Renouvellement', annulee: 'Visite annulée', rdv: 'Rendez-vous', autre: 'Autre' };
/* Les libellés reprennent ceux de la colonne « Actions menées » des exports Cosium */
const RESULTATS = {

/* ---------- Suivi des modifications (pour fusionner deux appareils) ----------
   Chaque patient et chaque rendez-vous reçoit « maj » (date ISO) quand il change.
   Si l'état entier est remplacé (chargement, démo, restauration, réception), rien n'est marqué. */
let TRACK_REF = null, TRACK_SIG = new Map();
const sigOf = o => { const { maj, ...rest } = o; return JSON.stringify(rest); };
function trackChanges() {
  if (!S) return;
  const first = TRACK_REF !== S; const now = new Date().toISOString(); const seen = new Map();
  const visit = (k, o) => { const sg = sigOf(o); if (!first && TRACK_SIG.get(k) !== sg) o.maj = now; seen.set(k, sg); };
  for (const p of Object.values(S.patients || {})) visit('p' + p.id, p);
  for (const r of S.rdv || []) visit('r' + r.id, r);
  TRACK_SIG = seen; TRACK_REF = S;
}
function mergeStates(local, remote) {
  const out = JSON.parse(JSON.stringify(local));
  const st = { patientsNew: 0, patientsMaj: 0, appels: 0, rdvNew: 0, rdvMaj: 0 };
  for (const [id, rp] of Object.entries(remote.patients || {})) {
    const lp = out.patients[id];
    if (!lp) { out.patients[id] = rp; st.patientsNew++; }
    else if ((rp.maj || '') > (lp.maj || '')) { out.patients[id] = rp; st.patientsMaj++; }
  }
  const rIdx = new Map(out.rdv.map((r, i) => [r.id, i]));
  for (const r of remote.rdv || []) {
    if (!rIdx.has(r.id)) { out.rdv.push(r); st.rdvNew++; }
    else { const i = rIdx.get(r.id); if ((r.maj || '') > (out.rdv[i].maj || '')) { out.rdv[i] = r; st.rdvMaj++; } }
  }
  const iIds = new Set(out.interventions.map(i => i.id));
  for (const it of remote.interventions || []) if (!iIds.has(it.id)) { out.interventions.push(it); st.appels++; }
  out.interventions.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const cIds = new Set((out.campagnes || []).map(c => c.id));
  for (const c of remote.campagnes || []) if (c.id && !cIds.has(c.id)) out.campagnes.push(c);
  const impKey = x => (x.date || '') + '|' + (x.fichier || x.fileName || '');
  const imp = new Set((out.imports || []).map(impKey));
  for (const x of remote.imports || []) if (!imp.has(impKey(x))) out.imports.push(x);
  out.demo = false;
  return { state: out, stats: st };
}

/* ---------- Fichier de transfert chiffré (AES-GCM 256, clé dérivée du mot de passe par PBKDF2) ---------- */
const TRANSFER_ITER = 250000;
function b64enc(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: TRANSFER_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

}

  let data = new TextEncoder().encode(JSON.stringify(state)); const gz = await gzipBytes(data); if (gz) data = gz;
  const key = await transferKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.stringify({ app: 'CRM AMZ', type: 'transfert', v: 1, de: deviceLabel(), le: new Date().toISOString(), patients: Object.keys(state.patients || {}).length, gz: !!gz, iter: TRANSFER_ITER, salt: b64enc(salt), iv: b64enc(iv), data: b64enc(ct) });
}
async function decryptTransfer(obj, pass) {
  const key = await transferKey(pass, b64dec(obj.salt));

  try { plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(obj.iv) }, key, b64dec(obj.data))); }
  catch (e) { throw new Error('mot-de-passe'); }

}

/* ---------- Calculs (recalculés à chaque affichage) ---------- */
let CX = null;
function invalidate() { CX = null; }
function cx() {
  if (CX) return CX;
  const t = TODAY();
  const rdvBy = new Map(), intBy = new Map();
  for (const r of S.rdv) if (r.patientId) { if (!rdvBy.has(r.patientId)) rdvBy.set(r.patientId, []); rdvBy.get(r.patientId).push(r); }
  for (const i of S.interventions) { if (!intBy.has(i.patientId)) intBy.set(i.patientId, []); intBy.get(i.patientId).push(i); }
  for (const a of intBy.values()) a.sort((x, y) => y.date.localeCompare(x.date));
  for (const a of rdvBy.values()) a.sort((x, y) => (y.date + y.heure).localeCompare(x.date + x.heure));
  const info = new Map();
  for (const p of Object.values(S.patients)) info.set(p.id, computeInfo(p, rdvBy.get(p.id) || [], intBy.get(p.id) || [], t));
  CX = { t, rdvBy, intBy, info };
  return CX;
}
const inListe = (p, k) => !!(p.listes && p.listes[k]);
function computeInfo(p, rdvs, ints, t) {
  const st = S.settings;
  // Dernière visite connue : fiche, rendez-vous honorés de l'agenda, et facture (la livraison est une visite)
  let visite = p.derniereVisite && p.derniereVisite <= t ? p.derniereVisite : null;
  let honore = false;
  for (const r of rdvs) if (r.statut === 'honore' && r.date <= t) { honore = true; if (!visite || r.date > visite) visite = r.date; }
  let derniere = visite;
  if (p.dateFacture && p.dateFacture <= t && (!derniere || p.dateFacture > derniere)) derniere = p.dateFacture;
  const futurs = rdvs.filter(r => r.date >= t && r.statut !== 'annule' && r.statut !== 'absent' && r.statut !== 'honore')
    .sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
  const prochain = futurs[0] || null;
  const echeanceCtrl = derniere ? addMonths(derniere, st.delaiControleMois) : null;
  // Contrôle dû : la dernière visite date de plus de N mois, pour un patient appareillé dont on connaît
  // vraiment une visite, ou présent dans la liste de relance « contrôle » de Cosium.
  const ctrlDu = !!echeanceCtrl && echeanceCtrl <= t && (inListe(p, 'controle') || (!!p.dateFacture && (!!p.derniereVisite || honore)));
  const excl = exclusion(p, ints);
  const ctrl = relState(ints.filter(i => i.motif === 'controle' && (!derniere || i.date.slice(0, 10) >= derniere)), prochain, t, excl);
  let renouv = null;
  if (p.dateFacture) {
    const eligible = addMonths(p.dateFacture, 12 * st.cycleRenouvAns);
    const fenetre = addMonths(t, st.anticipationMois);
    const etat = eligible <= t ? 'eligible' : eligible <= fenetre ? 'bientot' : 'plus_tard';
    renouv = { eligible, etat, ...relState(ints.filter(i => i.motif === 'renouvellement' && i.date.slice(0, 10) >= p.dateFacture), prochain, t, excl) };
  }
  let annul = null;
  if (inListe(p, 'annulee')) {
    const since = p.listes.annulee.depuis || '0000-00-00';
    annul = relState(ints.filter(i => i.motif === 'annulee' && i.date.slice(0, 10) >= since), prochain, t, excl);
  }
  return { derniere, visite, prochain, echeanceCtrl, ctrlDu, ctrl, renouv, annul, excl, inactif: !!p.inactif };
}
function relState(list, prochain, t, excl) {
  const n = list.length, last = list[0] || null;
  let code;
  if (prochain) code = 'rdv_prevu';
  else if (excl) code = 'exclu';
  else if (!last) code = 'a_relancer';
  // Pas de réponse ou message laissé avec une date de rappel : il faudra rappeler ce jour-là
  else if (last.rappelLe && ['message', 'pas_reponse', 'envoye'].includes(last.resultat)) code = last.rappelLe > t ? 'rappel_prevu' : 'a_rappeler';
  else switch (last.resultat) {
    case 'rdv': code = 'rdv_pris'; break;
    case 'refus': code = 'refus'; break;
    case 'rappeler': code = (last.rappelLe && last.rappelLe > t) ? 'rappel_prevu' : 'a_rappeler'; break;
    case 'faux_numero': code = 'coordonnees'; break;
    case 'repondu': code = 'repondu'; break;
    case 'divers': code = 'divers'; break;
    case 'nous_rappelle': code = daysBetween(last.date.slice(0, 10), t) < S.settings.delaiEntreRelancesJours ? 'nous_rappelle' : 'sans_reponse'; break;
    default: code = daysBetween(last.date.slice(0, 10), t) < S.settings.delaiEntreRelancesJours ? 'relance_recente' : 'sans_reponse';
  }
  return { n, last, code };
}

/* Statistiques de relances sur une période (jours) */
function relanceStats(days) {
  const t = TODAY(); const from = addDays(t, -days + 1);
  const relances = S.interventions.filter(i => (i.motif === 'controle' || i.motif === 'renouvellement' || i.motif === 'annulee') && i.resultat !== 'decede' && i.date.slice(0, 10) >= from);
  const byPatient = new Map();
  for (const i of relances) { if (!byPatient.has(i.patientId) || i.date < byPatient.get(i.patientId).date) byPatient.set(i.patientId, i); }
  const c = cx();
  let repondu = 0, rdv = 0; const canal = {};
  for (const [pid, first] of byPatient) {
    const after = (c.intBy.get(pid) || []).filter(i => i.date >= first.date);
    const hasRdvAgenda = (c.rdvBy.get(pid) || []).some(r => r.date >= first.date.slice(0, 10) && r.statut !== 'annule');
    const ans = after.some(i => ANSWERED.has(i.resultat)) || hasRdvAgenda;
    const gotRdv = after.some(i => i.resultat === 'rdv') || hasRdvAgenda;
    if (ans) repondu++; if (gotRdv) rdv++;
    const k = first.canal; canal[k] = canal[k] || { n: 0, rep: 0, rdv: 0 };
    canal[k].n++; if (ans) canal[k].rep++; if (gotRdv) canal[k].rdv++;
  }
  return { patients: byPatient.size, actions: relances.length, repondu, rdv, canal };
}
function campagneStats(cp) {
  const c = cx(); let rep = 0, rdv = 0;
  if (cp.motif === 'rdv' && cp.rdvs) {
    // Rappels de rendez-vous : « a répondu » = le statut a changé (confirmé, modifié, annulé) ; on compte aussi les venus
    const byId = new Map(S.rdv.map(r => [r.id, r]));
    for (const r0 of cp.rdvs) { const r = byId.get(r0.id); if (!r) continue; if (r.statut !== r0.statut && ['confirme', 'modifie', 'annule'].includes(r.statut)) rep++; if (r.statut === 'honore') rdv++; }
    return { rep, rdv, venus: true, n: cp.rdvs.length };
  }
  for (const pid of cp.ids) {
    const after = (c.intBy.get(pid) || []).filter(i => i.date >= cp.date && i.campagneId !== cp.id);
    const hasRdv = (c.rdvBy.get(pid) || []).some(r => r.date >= cp.date.slice(0, 10) && r.statut !== 'annule');
    if (after.some(i => ANSWERED.has(i.resultat)) || hasRdv) rep++;
    if (after.some(i => i.resultat === 'rdv') || hasRdv) rdv++;
  }
  return { rep, rdv };
}

  if (!s) return date < t ? 'inconnu' : 'non_confirme';
  if (/non confirm|a confirmer|attente|en attente|prevu|planifie|reserve/.test(s)) return 'non_confirme';
  if (/annul/.test(s)) return 'annule';
  if (/absent|non venu|pas venu|non honore|lapin|no show/.test(s)) return 'absent';
  if (/modif|deplac|report/.test(s)) return 'modifie';
  if (/confirm/.test(s)) return 'confirme';
  if (/honor|venu|realise|termine|effectue|arrive|present|fait|vu/.test(s)) return 'honore';
  return date < t ? 'inconnu' : 'non_confirme';
}

function saveCall() {

/* ---------- E-mail pré-rempli, modifiable avant l'envoi ---------- */
const SUJET = { controle: 'de votre contrôle auditif', renouvellement: 'du renouvellement de vos appareils auditifs', annulee: 'de votre bilan auditif', rdv: 'de votre rendez-vous', autre: 'de vos appareils auditifs' };
const POUR = { controle: ' pour votre contrôle auditif', renouvellement: ' pour le renouvellement de vos appareils auditifs', annulee: ' pour votre bilan auditif', rdv: '', autre: '' };
function buildMail(p, x) {
  const i = cx().info.get(p.id) || {};
  const motif = x.motif || 'autre'; const phrase = SUJET[motif] || SUJET.autre; const pour = POUR[motif] || '';
  const detail = motif === 'controle' && i.derniere ? ` (votre dernière visite date du ${fmtDate(i.derniere)})`

    case 'nous_rappelle':

      body = `Bonjour {civilite} {nom},\n\nMerci pour notre échange au sujet ${phrase}${detail}.\n\nComme convenu, vous pouvez nous rappeler quand vous le souhaitez au {tel_centre}, ou répondre à cet e-mail.` + sig; break;
    case 'rappeler':
      subject = 'Suite à notre appel';
      body = `Bonjour {civilite} {nom},\n\nMerci pour notre échange au sujet ${phrase}${detail}.\n\nComme convenu, nous vous rappellerons ${x.rappelLe ? 'le ' + fmtDay(x.rappelLe) : 'prochainement'}. En attendant, vous pouvez nous joindre au {tel_centre}.` + sig; break;
    case 'divers':

      body = `Bonjour {civilite} {nom},\n\nMerci pour notre échange au sujet ${phrase}.\n\nN'hésitez pas à nous contacter au {tel_centre} si vous avez la moindre question.` + sig; break;

/* ---------- Agenda ---------- */
function scrAgenda() {
  const t = TODAY(); if (!V.agAnchor) V.agAnchor = defaultAnchor();
  const ws = weekStart(V.agAnchor); const days = []; for (let k = 0; k < 7; k++) days.push(addDays(ws, k));
  const show = days.filter(d => parseISO(d).getDay() !== 0 || S.rdv.some(r => r.date === d));
  if (!V.agDay || !show.includes(V.agDay)) V.agDay = show.includes(t) ? t : (show.includes(V.agAnchor) ? V.agAnchor : show[0]);
  const list = S.rdv.filter(r => r.date === V.agDay).sort((a, b) => a.heure.localeCompare(b.heure));
  const act = list.filter(r => r.statut !== 'annule');
  const n = k => list.filter(r => r.statut === k).length;
  const col = { confirme: 'var(--green)', non_confirme: 'var(--orange)', modifie: 'var(--blue)', annule: 'var(--gray)', honore: 'var(--purple)', absent: 'var(--red)', inconnu: 'var(--gray)' };
  return `<header class="hero"><div class="head-row"><div><p class="date">${esc(cap(parseISO(ws).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })))}</p><h1 class="large-title">Agenda</h1></div>
    <div style="display:flex;gap:6px"><button class="text-btn" data-action="ag-move" data-n="-7" aria-label="Semaine précédente">‹ Préc.</button><button class="text-btn" data-action="ag-today">Aujourd'hui</button><button class="text-btn" data-action="ag-move" data-n="7" aria-label="Semaine suivante">Suiv. ›</button></div></div></header>
  <div class="days" style="--n:${show.length}">${show.map(d => { const c = S.rdv.filter(r => r.date === d && r.statut !== 'annule').length; return `<button class="day${d === t ? ' today' : ''}${d === V.agDay ? ' sel' : ''}" data-action="ag-day" data-d="${d}"><span class="wd">${esc(parseISO(d).toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''))}</span><span class="num">${parseISO(d).getDate()}</span><span class="cnt">${c ? c + ' RDV' : ''}</span></button>`; }).join('')}</div>
  <h2 class="sec-title">${esc(cap(fmtDay(V.agDay)))}</h2>
  ${list.length ? `<div class="summary-chips" style="margin:-4px 0 12px"><span>${plural(act.length, 'rendez-vous')}</span>${n('confirme') ? `<span><i style="background:var(--green)"></i>${nf(n('confirme'))} confirmé${n('confirme') > 1 ? 's' : ''}</span>` : ''}${n('non_confirme') ? `<span><i style="background:var(--orange)"></i>${nf(n('non_confirme'))} à confirmer</span>` : ''}${n('honore') ? `<span><i style="background:var(--purple)"></i>${nf(n('honore'))} venu${n('honore') > 1 ? 's' : ''}</span>` : ''}${n('absent') ? `<span><i style="background:var(--red)"></i>${nf(n('absent'))} absent${n('absent') > 1 ? 's' : ''}</span>` : ''}</div>` : ''}
  <div class="group">${list.map(r => { const s = RDV_STATUTS[r.statut] || RDV_STATUTS.inconnu; return `<button class="row" data-action="rdv-menu" data-rid="${r.id}"><span class="appt-bar" style="background:${col[r.statut] || 'var(--gray)'}"></span><span class="appt-time">${esc(fmtHeure(r.heure) || '–')}</span><span class="row-main"><span class="row-title"${r.statut === 'annule' ? ' style="text-decoration:line-through;color:var(--label2)"' : ''}>${esc(rdvLabel(r))}</span><span class="row-sub">${esc(r.type)}</span></span>${pill(s[0], TONE[s[1]])}</button>`; }).join('')}
  <button class="row blue" data-action="open-rdv">${icon('calplus')}<span class="row-main"><span class="row-title">Ajouter un rendez-vous</span></span></button></div>
  <p class="foot-note">Touche un rendez-vous pour le marquer confirmé, déplacé, venu ou absent.${S.imports.find(x => x.type === 'agenda') ? '' : ' Pour remplir l\'agenda, importe ton export Cosium dans Réglages.'}</p>`;
}
function rdvMenu(rid) {
  const r = S.rdv.find(x => x.id === rid); if (!r) return;
  const set = st => () => {
    const prev = r.statut; r.statut = st;
    let it = null;
    if (r.patientId && (st === 'confirme' || st === 'modifie')) it = addIntervention({ patientId: r.patientId, motif: 'rdv', canal: 'tel', resultat: 'repondu', note: `Rendez-vous du ${fmtDate(r.date)} ${st === 'confirme' ? 'confirmé' : 'déplacé'}` });
    persist(); render(); showToast(`Rendez-vous : ${RDV_STATUTS[st][0].toLowerCase()}`, () => { r.statut = prev; if (it) S.interventions = S.interventions.filter(x => x.id !== it.id); persist(); render(); });
  };
  const opts = [['Confirmé', set('confirme')], ['Déplacé', set('modifie')], ['Venu', set('honore')], ['Absent', set('absent')], ['Annulé', set('annule'), true]];
  if (r.patientId) opts.push(['Ouvrir la fiche', () => openSheet({ kind: 'patient', id: r.patientId, hint: 'rdv' })]);
  actionSheet(`${rdvLabel(r)}, ${fmtHeure(r.heure)}`, opts);
}

/* ---------- Envois ---------- */
const INTERNAL = /relance|rappel client|interne|devis|absence|cong[ée]|r[ée]union|formation|pause|bloqu|indisponib/i;
const LEGAL_IOS = {
  renouvellement_tel: "Relance commerciale par téléphone : depuis le 11 août 2026, il faut l'accord préalable du patient, sauf appel lié à un contrat en cours.",
  renouvellement_agent: "Appel automatisé à but commercial : seuls les patients avec un accord « Agent vocal » sont gardés.",
  renouvellement_sms: "Relance commerciale : possible pour un client existant s'il a été informé et peut refuser facilement (mention STOP).",
  renouvellement_email: "Relance commerciale : possible pour un client existant s'il a été informé et peut se désinscrire facilement.",
  annulee: "Ces personnes n'ont souvent jamais acheté : il est plus sûr de ne contacter que celles qui ont donné leur accord.",
};
function consentDefault(m, c) { if (m === 'rdv') return false; if (m === 'annulee') return true; if (c === 'agent') return m !== 'controle'; if (m === 'renouvellement' && c === 'tel') return true; return false; }
const SEND_KINDS = [
  ['rdv', 'Rappels de rendez-vous', 'agenda', 'rdv'], ['renouvellement', 'Renouvellements', 'sparkle', 'ren'],
  ['controle', 'Contrôles', 'check', 'ctrl'], ['annulee', 'Visites annulées', 'xmark', 'ann'],
];
function sendBase(motif, per) {
  const t = TODAY(), c = cx();
  if (motif === 'controle') return listControles().filter(x => TO_DO.has(x.i.ctrl.code));
  if (motif === 'renouvellement') return listRenouv().filter(x => x.i.renouv.etat === 'eligible' && TO_DO.has(x.i.renouv.code));
  if (motif === 'annulee') return listAnnulees().filter(x => TO_DO.has(x.i.annul.code));
  const from = nextWorkday(t), to = per === 'semaine' ? addDays(from, 6) : from;
  return S.rdv.filter(r => r.date >= from && r.date <= to && ['non_confirme', 'confirme', 'modifie'].includes(r.statut) && !INTERNAL.test(r.type) && r.patientId && S.patients[r.patientId] && !S.patients[r.patientId].inactif)
    .sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure)).map(r => ({ p: S.patients[r.patientId], i: c.info.get(r.patientId), rdv: r }));
}
function sendList(s) {
  const t = TODAY(), c = cx(); const ck = { sms: 'sms', email: 'email', agent: 'agent', tel: 'appel' }[s.canal];
  const base = sendBase(s.motif, s.per); const list = [], ex = { contact: 0, consent: 0, recent: 0 };
  for (const x of base) {
    const key = x.rdv ? 'r' + x.rdv.id : x.p.id;
    const contact = s.canal === 'email' ? x.p.email : s.canal === 'sms' ? [x.p.tel1, x.p.tel2, x.p.tel3].find(isMobile) : (x.p.tel1 || x.p.tel2 || x.p.tel3);
    if (!contact) { ex.contact++; continue; }
    if (s.consent && !(x.p.consent && x.p.consent[ck] && x.p.consent[ck].ok)) { ex.consent++; continue; }
    if (s.motif !== 'rdv') { const last = (c.intBy.get(x.p.id) || []).find(i => i.motif !== 'rdv'); if (last && daysBetween(last.date.slice(0, 10), t) < S.settings.delaiEntreRelancesJours) { ex.recent++; continue; } }
    list.push({ ...x, key, contact, on: !s.excluded.has(key) });
  }
  return { list, ex, base: base.length };
}

function sheetSend(s) {
  const { list, ex, base } = sendList(s); const on = list.filter(x => x.on); const sample = on[0] || list[0];
  const key = s.canal === 'email' ? 'email' : s.canal === 'tel' ? 'agent' : s.canal;
  const tpl = getTpl(s.motif, key); const filled = sample ? fillTpl(tpl, sample.p, sample.rdv) : '';
  const legal = LEGAL_IOS[`${s.motif}_${s.canal}`] || LEGAL_IOS[s.motif];
  const locked = s.motif === 'renouvellement' && s.canal === 'agent';
  let preview = '';
  if (!sample) preview = '<div class="empty">Personne à contacter avec ces réglages.</div>';
  else if (s.canal === 'sms') { const si = smsInfo(filled); preview = `<div class="bubble-wrap"><div class="bubble">${esc(filled)}</div></div><p class="foot-note">${si.len} caractères, ${si.parts} SMS par patient${si.ucs ? `. <button class="text-btn" style="font-size:13px;padding:0" data-action="gsm">Remplacer les accents (ô, ê, ç…) pour payer moins</button>` : ''}.</p>`; }

  const exTxt = [ex.contact ? `${nf(ex.contact)} sans ${s.canal === 'email' ? 'e-mail' : s.canal === 'sms' ? 'portable' : 'numéro'}` : '', ex.consent ? `${nf(ex.consent)} sans accord` : '', ex.recent ? `${nf(ex.recent)} relancés récemment` : ''].filter(Boolean).join(', ');
  const body = `${s.motif === 'rdv' ? `<div class="segmented" role="group" aria-label="Période" style="margin-top:4px">${[['demain', `Le ${parseISO(nextWorkday(TODAY())).toLocaleDateString('fr-FR', { weekday: 'long' })}`], ['semaine', 'Les 7 prochains jours']].map(([k, l]) => `<button aria-pressed="${s.per === k}" data-action="send-per" data-v="${k}">${esc(l)}</button>`).join('')}</div>` : ''}
  <div class="segmented" role="group" aria-label="Moyen">${[['sms', 'SMS'], ['email', 'E-mail'], ['agent', 'Agent vocal'], ['tel', 'Appel']].map(([k, l]) => `<button aria-pressed="${s.canal === k}" data-action="send-canal" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="count-big"><b>${nf(on.length)}</b><span>${on.length > 1 ? 'patients' : 'patient'}${base !== list.length && exTxt ? ` (${exTxt})` : ''}</span></div>

  <h2 class="sec-title">${s.canal === 'tel' ? 'Quoi dire' : s.canal === 'agent' ? 'Ce que dira l\'agent' : 'Le message'}${sample ? ` <small>pour ${esc(plainName(sample.p))}</small>` : ''}</h2>

function sheetImport(s) {

    <div style="margin-top:20px"><button class="btn primary" data-action="imp-finish">Voir mes relances</button></div>`;

    body = `<div class="group" style="margin-top:10px">${s.preps.map(pr => { const good = readyToImport(pr); return `<div class="row with-ico"><span class="sq ${good ? 'green' : 'orange'}">${icon(good ? 'check' : 'xmark')}</span><span class="row-main"><span class="row-title" style="font-size:16px">${esc(pr.fileName)}</span><span class="row-sub wrap">${good ? (pr.cosium ? `${esc(pr.cosium.titre)}${pr.liste ? ' → ' + esc(LISTES[pr.liste]) : ''}` : `Reconnu comme ${esc(TYPE_LABELS[pr.type][0].toLowerCase())}`) + `, ${plural(dataRows(pr).length, 'ligne')}` : 'Colonnes non reconnues : utilise la version complète pour les choisir.'}</span></span></div>`; }).join('')}</div>

  } else {
    body = `<div class="group" style="margin-top:8px"><ol class="steps-n"><li>Dans Cosium, ouvre tes listes « Relances » (renouvellement, RDV 6 mois, 1re visite annulée).</li><li>Exporte chaque liste en fichier Excel.</li><li>Glisse les fichiers ci-dessous, tous en même temps.</li></ol></div>

    ${s.error ? `<p class="legal">${esc(s.error)}</p>` : ''}

function impSummary(r) {
  if (r.type === 'agenda') return `${plural(r.rdv || 0, 'rendez-vous')} importés`;
  const parts = [`${plural(r.nouveaux, 'nouveau patient', 'nouveaux patients')}`, `${plural(r.misAJour, 'mis à jour', 'mis à jour')}`];
  if (r.liste) parts.push(`liste « ${LISTES[r.liste]} »`);
  if (r.actions) parts.push(`${plural(r.actions, 'action reprise', 'actions reprises')}`);
  return parts.join(', ');
}
async function readImportFiles(files) {
  const s = V.sheet; s.busy = true; s.error = null; renderSheet();
  const preps = [], errs = [];
  for (const f of Array.from(files)) { try { preps.push(await prepareFile(f)); } catch (e) { errs.push(e instanceof UserError ? e.message : `Impossible de lire « ${f.name} ».`); } }
  s.busy = false; s.preps = preps; s.error = errs.join(' ') || null; s.step = preps.length ? 'ready' : 'choose'; renderSheet();
}

}

  'imp-again': () => { V.sheet.step = 'choose'; V.sheet.preps = []; V.sheet.error = null; renderSheet(); },
  'imp-go': () => {
    const s = V.sheet; const ok = s.preps.filter(pr => readyToImport(pr));
    if (S.demo) { const keep = { settings: S.settings, templates: S.templates, lastBackup: S.lastBackup, guideHidden: S.guideHidden }; S = { ...blankState(), ...keep, demo: false }; }
    s.results = ok.map(pr => importPrepared(pr)); persist(); s.step = 'done'; render();
  },
  'imp-finish': () => { closeSheet(); V.seg = 'renouvellement'; V.all = false; location.hash = '#today'; render(); },
  'backup': () => { S.lastBackup = nowStamp(); downloadFile(`crm-amz-sauvegarde-${TODAY()}.json`, JSON.stringify(S), 'application/json'); persist(); render(); showToast('Sauvegarde téléchargée'); },
  'step': el => { const k = el.dataset.k; S.settings[k] = Math.max(+el.dataset.min, Math.min(+el.dataset.max, (+S.settings[k] || 0) + (+el.dataset.d))); persist(); render(); },
  'wipe': () => iosAlert({ title: 'Effacer toutes les données ?', text: 'Patients, relances et rendez-vous seront effacés de ce navigateur. Les réglages sont gardés.', ok: 'Effacer', destructive: true, onOk: () => { S = { ...blankState(), settings: S.settings, templates: S.templates, lastBackup: S.lastBackup }; persist(); render(); showToast('Données effacées'); } }),
  'alert-cancel': () => closeAlert(),
  'alert-ok': () => { const f = alertOk; closeAlert(); if (f) f(); },
  'as-close': (el, e) => { if (el.classList.contains('alert-backdrop') && e.target !== el) return; closeAlert(); },
  'as-opt': el => { const o = asOpts[+el.dataset.k]; closeAlert(); if (o) o[1](); },
};
let qTimer = null;
const IN = {
  'q': el => { clearTimeout(qTimer); qTimer = setTimeout(() => { V.q = el.value; V.shown = 60; const pos = el.selectionStart; render(); const f = $('input[data-input="q"]'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }, 180); },
  'call-note': el => {
    const s = V.sheet; if (!s) return; s.note = el.value;
    el.classList.toggle('need', !el.value.trim());
    const ready = !callMissing(s).length; const b = $('#save-call'); if (b) b.disabled = !ready;
    const m = $('#call-missing'); if (m) { m.textContent = missingText(s); m.classList.toggle('ok', ready); }
  },
  'mail': el => { if (V.sheet) V.sheet[el.dataset.k] = el.value; },
  'tr': el => { if (V.sheet) V.sheet[el.dataset.k] = el.value; },
  'sms-body': el => { if (!V.sheet) return; V.sheet.body = el.value; const c = $('#sms-count'); if (c) c.textContent = smsCount(el.value); },
  'tpl': el => { setTpl(V.sheet.motif, el.dataset.k, el.value); persist(); clearTimeout(IN._t); IN._t = setTimeout(() => { const ae = document.activeElement; const pos = ae && ae.selectionStart; const k = ae && ae.dataset.k; invalidate(); renderSheet(); if (k) { const f = $(`[data-input="tpl"][data-k="${k}"]`); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) {} } } }, 500); },
};
const CH = {
  'consent': el => { const p = S.patients[el.dataset.id]; p.consent = p.consent || {}; p.consent[el.dataset.k] = { ok: el.checked, date: TODAY(), source: 'Fiche' }; persist(); render(); },
  'pnote': el => { const p = S.patients[el.dataset.id]; p.notes = el.value.trim(); persist(); render(); showToast('Note enregistrée'); },
  'setting': el => { S.settings[el.dataset.k] = el.value.trim(); persist(); showToast('Enregistré'); },
  'send-consent': el => { V.sheet.consent = el.checked; renderSheet(); },
  'call-mail': el => { V.sheet.mail = el.checked; },
  'call-sms': el => { V.sheet.sms = el.checked; },
  'tr-remember': el => { V.sheet.remember = el.checked; if (!el.checked) rememberPass('', false); },
  'tr-file': async el => {
    const s = V.sheet; const file = el.files[0]; if (!file) return;
    s.file = null; s.raw = null; s.remote = null; s.msg = ''; s.ok = false;
    try {
      const o = JSON.parse(await file.text());
      if (o && o.type === 'transfert' && o.data) { s.raw = o; s.file = { name: file.name, enc: true, de: o.de, le: o.le, patients: o.patients }; }
      else if (o && typeof o.patients === 'object') { s.file = { name: file.name, enc: false, patients: Object.keys(o.patients).length }; s.remote = normalizeState(o); }
      else throw 0;
    } catch (e) { s.msg = 'Ce fichier n\'est pas un fichier du CRM AMZ.'; }
    el.value = ''; renderSheet();
  },
  'call-rdv': el => { V.sheet[el.dataset.k] = el.value; const s = V.sheet; const ready = !callMissing(s).length; const b = $('#save-call'); if (b) b.disabled = !ready; const m = $('#call-missing'); if (m) { m.textContent = missingText(s); m.classList.toggle('ok', ready); } },
  'send-inc': el => { const s = V.sheet; if (el.checked) s.excluded.delete(el.dataset.k); else s.excluded.add(el.dataset.k); renderSheet(); },
  'imp-files': el => { if (el.files && el.files.length) readImportFiles(el.files); },
  'restore': async el => {
    const f = el.files[0]; if (!f) return;
    try { const o = JSON.parse(await f.text()); if (!o || typeof o.patients !== 'object') throw 0;
      iosAlert({ title: 'Restaurer cette sauvegarde ?', text: `${plural(Object.keys(o.patients).length, 'patient')}. Les données actuelles seront remplacées.`, ok: 'Restaurer', destructive: true, onOk: () => { S = normalizeState(o); persist(); render(); showToast('Sauvegarde restaurée'); } });
    } catch (e) { showToast('Ce fichier n\'est pas une sauvegarde du CRM AMZ.'); }
    el.value = '';
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if ((a === 'sheet-bg') && e.target !== el) return;
  const f = A[a]; if (!f) return; e.preventDefault(); f(el, e);
});
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-input]'); if (el && IN[el.dataset.input]) IN[el.dataset.input](el, e); });
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-change]'); if (el && CH[el.dataset.change]) CH[el.dataset.change](el, e); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#alert-root').innerHTML) closeAlert(); else if (V.sheet) closeSheet(); });
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.remove('over'); if (ev === 'drop' && e.dataTransfer.files.length) readImportFiles(e.dataTransfer.files); } }));
window.addEventListener('dragover', e => e.preventDefault()); window.addEventListener('drop', e => e.preventDefault());
function init() { S = restoreState(); if (!S) { S = makeDemo(); persist(); } else trackChanges();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} window.addEventListener('hashchange', route); route(); }
init();

</script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
